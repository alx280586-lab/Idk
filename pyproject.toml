[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fnc"
version = "0.1.0"
description = "Research scaffolding for fractal neural compression"
authors = [{name = "FNC Authors"}]
readme = "README.md"
license = {text = "MIT License"}
requires-python = ">=3.11"
dependencies = [
  "torch>=2.2",
  "numpy",
  "omegaconf",
  "typer",
  "pytest",
  "loguru",
  "tqdm"
]

[project.urls]
homepage = "https://example.com/fnc"
repository = "https://example.com/fnc.git"

[tool.setuptools.packages.find]
where = ["fnc"]
include = ["fnc*"]
