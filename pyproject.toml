[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextgen-radar"
version = "0.1.0"
description = "Ultra-advanced interactive weather radar visualization engine"
readme = "README.md"
requires-python = ">=3.9"
authors = [
  {name = "NextGen Radar Team"}
]
dependencies = [
  "numpy>=1.23",
  "xarray>=2023.1",
  "pyproj>=3.5",
  "shapely>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.23",
  "pydantic>=2.5",
  "orjson>=3.9",
  "aiohttp>=3.9",
  "cachetools>=5.3",
  "pillow>=9.0",
  "jinja2>=3.1",
  "netCDF4>=1.6"
]

[project.optional-dependencies]
development = [
  "pytest>=7.2",
  "httpx>=0.25"
]

[tool.setuptools.package-dir]
nextgen_radar = "src/nextgen_radar"

[tool.setuptools.packages.find]
where = ["src"]
