model:
  d_model: 2048
  n_layers: 24
  n_heads: 16
  vocab_size: 50257
  max_seq_len: 2048
  mlp_ratio: 4
generator:
  latent_dim: 512
  spectral_bases: ["fourier", "wavelet"]
  num_lod: 2
  coord_embed_dim: 128
  modulation_dim: 64
  quant_policy:
    default_bits: 6
    allow_learned: true
runtime:
  cache_bytes_gpu: 2000000000
  cache_bytes_cpu: 8000000000
  prefetch_window: 4
  device_budget: "auto"
training:
  optimizer: "adamw"
  lr: 1e-4
  warmup_steps: 2000
  batch_tokens: 524288
  grad_clip: 1.0
  precision: "bf16"
  ema_decay: 0.999
  seed: 1337
data:
  dataset_path: "/path/to/text-corpus"
  tokenizer: "bpe"
logging:
  wandb: false
